# T2 + recon-DWI universal image baseline on the aligned consecutive split.
# Run with: uv run python -m scripts.grid_train --config configs/image/rss/image_t2_recon_dwi_universal.yaml
experiments:
  - name: image_t2_recon_dwi_universal_adc_b1500_mtl_consecutive_aligned_grid
    mode: image
    base_args:
      h5_root: /gpfs/scratch/td2105/dwi_stream/recons_rss_espirit
      dicom_h5_roots:
        - /gpfs/data/prostatelab/processed_data/h5/t2_dwi_filtered_20240212
        - /gpfs/data/prostatelab/processed_data/h5/t2_dwi_filtered_2024_data_20250408
      labels_csv: /gpfs/data/prostatelab/processed_data/csv/prostate_mri_radiology_reports_201212_202508.csv
      pathology_csv: /gpfs/data/prostatelab/processed_data/csv/MRI_with_followup_biopsy_0to180d_and_psa_density.csv
      image_source: hybrid
      image_metrics: adc_b1500
      model_variant: t2_recon_dwi_fusion
      fusion_gate: false
      coil_combine: rss
      averaging_tags:
        - b50_1_b1000_1
        - b50_1_b1000_2
        - b50_1_b1000_3
        - b50_2_b1000_6
        - b50_4_b1000_12
      cohort: aligned
      split_strategy: consecutive_patient_holdout
      split_test_frac: 0.10
      split_pool_train_frac: 0.85
      enable_gleason_task: true
      gleason_positive_grade_group_threshold: 2
      primary_metric: gleason_auroc
      output_dir: outputs/image_t2_recon_dwi_universal/adc_b1500_mtl_consecutive_aligned_grid
      device: cuda
      epochs: 60
      batch_size: 8
      log_interval: 100
      eval_interval_steps: 1000
      lr_scheduler: cosine
      lr_warmup_epochs: 2
      grad_accum_steps: 2
      early_stopping_patience: 10
      num_workers: 4
      date_buffer_days: 7
      wandb_project: prostate-kspace-classifier
      wandb_mode: online
      amp_dtype: none
      backbone_pretrained: false
      freeze_backbone: false
      augment: true
      dropout: 0.3
      label_smoothing: 0.0
      backbone: r3d_18
    grid_params:
      pirads_loss_weight: [1.0]
      gleason_loss_weight: [0.5]
      lr: [1e-05, 7e-05, 1e-04, 3e-04, 5e-04]
      weight_decay: [1e-03, 1e-02, 3e-02]
      seed: [5555]
      wandb_group: [imaget2recondwi_aligned_bestcfg]
