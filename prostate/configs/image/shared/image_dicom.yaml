# Image classifier using original DICOM ADC/b1500 (scanner-reconstructed)
# Run with: uv run python -m scripts.grid_train --config configs/image/shared/image_dicom.yaml
experiments:
  - name: image_dicom_mtl_consecutive_dicom_only
    mode: image
    base_args:
      h5_root: /gpfs/scratch/td2105/dwi_stream/recons_rss_espirit
      dicom_h5_roots:
        - /gpfs/data/prostatelab/processed_data/h5/t2_dwi_filtered_20240212
        - /gpfs/data/prostatelab/processed_data/h5/t2_dwi_filtered_2024_data_20250408
      labels_csv: /gpfs/data/prostatelab/processed_data/csv/prostate_mri_radiology_reports_201212_202508.csv
      pathology_csv: /gpfs/data/prostatelab/processed_data/csv/MRI_with_followup_biopsy_0to180d_and_psa_density.csv
      image_source: dicom
      image_metrics: adc_b1500
      cohort: dicom_only
      split_strategy: consecutive_patient_holdout
      split_test_frac: 0.10
      split_pool_train_frac: 0.85
      enable_gleason_task: true
      gleason_positive_grade_group_threshold: 2
      primary_metric: gleason_auroc
      output_dir: outputs/image_dicom/mtl_consecutive_dicom_only
      device: cuda
      epochs: 200
      batch_size: 8
      log_interval: 100
      eval_interval_steps: 1000
      lr_scheduler: cosine
      lr_warmup_epochs: 2
      grad_accum_steps: 2
      early_stopping_patience: 30
      seed: 10000
      num_workers: 4
      date_buffer_days: 7
      wandb_project: prostate-kspace-classifier
      wandb_mode: online
      amp_dtype: none
      model_variant: single_stream
      backbone_pretrained: false
      freeze_backbone: false
      augment: true
      dropout: 0.3
      label_smoothing: 0.0
      backbone: r3d_18
    grid_params:
      image_metrics: [adc_b1500]
      pirads_loss_weight: [1.0]
      gleason_loss_weight: [0.5]
      lr: [3e-05]
      weight_decay: [1e-03]
      seed: [9997, 9998, 9999]
      wandb_group: [imagedicom_split_consecutive_patient_holdout_dicom_only_lr3e-05_wd1e-03_seed3]

  - name: image_dicom_mtl_consecutive_aligned
    mode: image
    base_args:
      h5_root: /gpfs/scratch/td2105/dwi_stream/recons_rss_espirit
      dicom_h5_roots:
        - /gpfs/data/prostatelab/processed_data/h5/t2_dwi_filtered_20240212
        - /gpfs/data/prostatelab/processed_data/h5/t2_dwi_filtered_2024_data_20250408
      labels_csv: /gpfs/data/prostatelab/processed_data/csv/prostate_mri_radiology_reports_201212_202508.csv
      pathology_csv: /gpfs/data/prostatelab/processed_data/csv/MRI_with_followup_biopsy_0to180d_and_psa_density.csv
      image_source: dicom
      image_metrics: adc_b1500
      cohort: aligned
      split_strategy: consecutive_patient_holdout
      split_test_frac: 0.10
      split_pool_train_frac: 0.85
      enable_gleason_task: true
      gleason_positive_grade_group_threshold: 2
      primary_metric: gleason_auroc
      output_dir: outputs/image_dicom/mtl_consecutive_aligned
      device: cuda
      epochs: 200
      batch_size: 8
      log_interval: 100
      eval_interval_steps: 1000
      lr_scheduler: cosine
      lr_warmup_epochs: 2
      grad_accum_steps: 2
      early_stopping_patience: 30
      seed: 10000
      num_workers: 4
      date_buffer_days: 7
      wandb_project: prostate-kspace-classifier
      wandb_mode: online
      model_variant: single_stream
      backbone_pretrained: false
      freeze_backbone: false
      augment: true
      dropout: 0.3
      label_smoothing: 0.0
      backbone: r3d_18
    grid_params:
      image_metrics: [adc_b1500]
      pirads_loss_weight: [1.0]
      gleason_loss_weight: [0.5]
      lr: [3e-05]
      weight_decay: [1e-02]
      seed: [9997, 9998, 9999]
      wandb_group: [imagedicom_split_consecutive_patient_holdout_aligned_lr3e-05_wd1e-02_seed3]
